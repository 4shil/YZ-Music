name: Android CI & Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Secrets (Keystore & local.properties)
      env:
        MODULE_INDEX_URL: ${{ secrets.MODULE_INDEX_URL }}
        LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        echo "MODULE_INDEX_URL=$MODULE_INDEX_URL" > local.properties
        echo "LASTFM_API_KEY=$LASTFM_API_KEY" >> local.properties
        echo "LASTFM_SECRET=$LASTFM_SECRET" >> local.properties

        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > yzmusic-release.jks
          KEY_PASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          if [ -s yzmusic-release.jks ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "storeFile=yzmusic-release.jks" > keystore.properties
            echo "storePassword=$KEYSTORE_PASSWORD" >> keystore.properties
            echo "keyAlias=$KEY_ALIAS" >> keystore.properties
            echo "keyPassword=$KEY_PASS" >> keystore.properties
          fi
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Unit Tests
      run: ./gradlew testProdDebugUnitTest

    - name: Build Prod Release APK
      run: ./gradlew assembleProdRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: yzmusic-prod-release
        path: app/build/outputs/apk/prod/release/*.apk

    - name: Prepare Release APK Name
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        cp app/build/outputs/apk/prod/release/app-prod-release.apk app/build/outputs/apk/prod/release/YZMusic-${{ github.ref_name }}.apk

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          app/build/outputs/apk/prod/release/YZMusic-${{ github.ref_name }}.apk
          app/build/outputs/apk/prod/release/app-prod-release.apk
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
